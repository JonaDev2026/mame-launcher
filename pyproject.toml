[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mame-launcher"
version = "0.1.0"
description = "Sleek desktop launcher for MAME arcade emulation with auto metadata and cover art."
readme = "readme.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Jonathan Sanfilippo" }]
keywords = ["mame", "launcher", "emulation", "pyside6", "rom"]
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools]
py-modules = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["F", "E9"]  # bug-catching only; style churn not worth it